<section class="objects" aria-labelledby="objects-title">
  <div class="objects__panel">
    <nav class="objects__breadcrumbs" aria-label="Хлебные крошки">
      <a class="objects__breadcrumb-link" href="#/">Главная</a>
      <span class="objects__breadcrumb-separator" aria-hidden="true">-</span>
      <span aria-current="page">Каталог зданий</span>
    </nav>

    <h1 class="objects__title" id="objects-title">
      <span>Наши обьекты</span>
      <span class="objects__count">(9)</span>
    </h1>

    <div class="objects__toolbar">
      <form class="objects__search-group" role="search">
        <label class="objects__label" for="objects-project-id">Поиск:</label>
        <div class="objects__search-field">
          <svg class="objects__search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input
            class="objects__search-input"
            id="objects-project-id"
            name="project-id"
            type="search"
            placeholder="Введите ID проекта"
            autocomplete="off"
          >
        </div>
      </form>

      <div class="objects__view-group">
        <span class="objects__label">Отображение:</span>
        <div class="objects__view-options" role="group" aria-label="Способ отображения объектов">
          <div class="objects__view-option">
            <span class="objects__view-name">Карточки</span>
            <button class="objects__view-control" type="button" data-objects-view="cards" aria-label="Показать объекты карточками" aria-pressed="false">
              <svg class="objects__view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
              </svg>
            </button>
          </div>

          <div class="objects__view-option">
            <span class="objects__view-name">На карте</span>
            <button class="objects__view-control is-active" type="button" data-objects-view="map" aria-label="Показать объекты на карте" aria-pressed="true">
              <svg class="objects__view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path>
                <path d="M9 3v15M15 6v15"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="objects-map" aria-label="Карта объектов">
    <iframe
      class="objects-map__frame"
      title="Расположение объектов на Яндекс Картах"
      src="https://yandex.ru/map-widget/v1/?ll=75.3229%2C51.7237&z=12&pt=75.3229%2C51.7237%2Cpm2rdm"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <form class="objects-map__filters" aria-label="Фильтры объектов">
      <div class="objects-map__filters-heading">
        <h2 class="objects-map__filters-title">Фильтр:</h2>
      </div>

      <button class="objects-map__mobile-toggle" type="button" aria-expanded="false" aria-controls="objects-map-filter-fields">
        <span>Фильтры</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"></path></svg>
      </button>

      <div class="objects-map__filter-fields" id="objects-map-filter-fields">
      <label class="objects-map__filter">
        <span class="objects-map__filter-label">Год:</span>
        <select name="year">
          <option value="">Все</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
      </label>

      <label class="objects-map__filter">
        <span class="objects-map__filter-label">Страна:</span>
        <select name="country">
          <option value="">Все</option>
          <option value="Казахстан">Казахстан</option>
          <option value="Россия">Россия</option>
        </select>
      </label>

      <label class="objects-map__filter">
        <span class="objects-map__filter-label">Регион:</span>
        <select name="region">
          <option value="">Все</option>
          <option value="Павлодарская область">Павлодарская область</option>
        </select>
      </label>

      <label class="objects-map__filter">
        <span class="objects-map__filter-label">Сегменты:</span>
        <select name="segment">
          <option value="">Все</option>
          <option value="Промышленность">Промышленность</option>
          <option value="Транспорт">Транспорт</option>
        </select>
      </label>

      </div>

      <button class="objects-map__more" type="button" aria-expanded="false">
        <span>Еще фильтры</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>

      <div class="objects-map__extra-filters" hidden>
        <label class="objects-map__filter">
          <span class="objects-map__filter-label">Технология:</span>
          <select name="technology">
            <option value="">Все</option>
            <option value="Металлоконструкции">Металлоконструкции</option>
          </select>
        </label>
        <label class="objects-map__filter">
          <span class="objects-map__filter-label">Тип объекта:</span>
          <select name="object-type">
            <option value="">Все</option>
            <option value="Цех">Цех</option>
            <option value="Склад">Склад</option>
          </select>
        </label>
      </div>

      <button class="objects-map__submit" type="submit">Показать</button>
    </form>

    <article class="objects-map__card" aria-label="Информация об объекте">
      <div class="objects-map__card-image" role="img" aria-label="Промышленный объект"></div>
      <div class="objects-map__card-content">
        <div class="objects-map__card-heading">
          <h3 class="objects-map__card-title">Быстровозводимый цех для ремонта вагонных колес</h3>
          <button class="objects-map__card-close" type="button" aria-label="Скрыть карточку объекта">×</button>
        </div>
        <dl class="objects-map__details">
          <div>
            <dt>Размеры</dt>
            <dd>10Ш × 54Д × 6.5В</dd>
          </div>
          <div>
            <dt>Локация</dt>
            <dd>г. Экибастуз, Казахстан</dd>
          </div>
        </dl>
        <a class="objects-map__details-link" href="https://yandex.ru/maps/?text=Экибастуз%2C%20Казахстан" target="_blank" rel="noopener noreferrer">Подробнее</a>
      </div>
    </article>
  </section>
</section>
