<!-- Cookie consent popup. Подключение к приложению будет выполнено отдельно. -->
<div class="cookies" role="dialog" aria-labelledby="cookies-title" aria-describedby="cookies-description" hidden>
  <div class="cookies__content">
    <h2 class="cookies__title" id="cookies-title">Использование cookies</h2>
    <p class="cookies__description" id="cookies-description">
      Мы используем cookies для корректной работы сайта и улучшения пользовательского опыта.
    </p>
    <div class="cookies__actions">
      <button class="cookies__button cookies__button--accept" type="button" data-cookies-accept>
        Принять
      </button>
      <button class="cookies__button cookies__button--reject" type="button" data-cookies-reject>
        Отклонить необязательные
      </button>
    </div>
  </div>
</div>
